<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Statistiche – Ilaria</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6fb;margin:0;color:#172033}main{max-width:900px;margin:auto;padding:25px 15px}.box{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #0001}.row{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px;padding:10px;border-bottom:1px solid #eee}.head{font-weight:700}@media(max-width:600px){.row{grid-template-columns:1.7fr 1fr 1fr}.hide{display:none}}a{color:#315ee8}</style></head><body><main><p><a href="index.html">← Home</a></p><h1>📊 Statistiche di Ilaria</h1><div class="box"><div id="summary">Caricamento…</div></div><div class="box"><h2>Risultati per quiz</h2><div class="row head"><span>Quiz</span><span>Tentativi</span><span>Migliore</span><span class="hide">Media</span><span class="hide">Ultimo</span></div><div id="rows"></div></div></main><script>
const U='https://ocqnqswrwgvncylnajhz.supabase.co',K='sb_publishable_5i67B4YIeEwGCxYgXSrxzw_APqa2CXz';async function load(){let r=await fetch(U+'/rest/v1/quiz_attempts?select=*&order=created_at.desc',{headers:{apikey:K,Authorization:'Bearer '+K}}),d=await r.json();if(!Array.isArray(d)){document.getElementById('summary').textContent='Impossibile caricare le statistiche.';return}document.getElementById('summary').innerHTML='<b>'+d.length+'</b> quiz completati registrati.';let g={};d.forEach(x=>{let k=x.subject+' · '+x.topic+' · '+x.quiz_name;(g[k]??=[]).push(x)});document.getElementById('rows').innerHTML=Object.entries(g).map(([k,a])=>{let best=Math.max(...a.map(x=>+x.grade)),avg=(a.reduce((s,x)=>s+(+x.grade),0)/a.length).toFixed(1),last=new Date(a[0].created_at).toLocaleString('it-CH',{dateStyle:'short',timeStyle:'short'});return '<div class="row"><span>'+k+'</span><b>'+a.length+'</b><b>'+best.toFixed(1)+'/6</b><span class="hide">'+avg+'/6</span><span class="hide">'+last+'</span></div>'}).join('')||'<p>Nessun quiz completato da quando sono state attivate le statistiche.</p>'}load();</script></body></html>
