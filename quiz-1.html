<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 1 – Tedesco</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6fb;margin:0;color:#172033}main{max-width:680px;margin:auto;padding:24px 16px}.box{background:#fff;padding:22px;border-radius:18px;box-shadow:0 3px 15px #0001}input{font-size:18px;padding:11px;border:1px solid #bbc3d1;border-radius:10px;width:150px;max-width:80%}button{font-size:16px;padding:12px 16px;border:0;border-radius:11px;margin:7px 5px 0 0;background:#315ee8;color:white}.alt{background:#e9edf7;color:#172033}.ok{color:#14823b;font-weight:700}.bad{color:#bd2838;font-weight:700}.top{display:flex;justify-content:space-between;gap:10px}.sentence{font-size:20px;line-height:2.5}</style></head><body><main id="main"><div class="box"><div class="top"><b id="prog"></b><b>Punti: <span id="score">0</span></b></div><h2 id="q"></h2><div id="inputs"></div><p id="fb"></p><button id="check">Controlla</button><button id="solution" class="alt">Mostra soluzione</button><button id="later" class="alt">Chiedimelo dopo</button><button id="next" class="alt">Prossima</button></div></main><script>
const $=id=>document.getElementById(id);function norm(s){return s.toLocaleLowerCase('de-DE').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.,!?;:„“”"'’`´]/g,'').replace(/[-–—]/g,' ').replace(/\s+/g,' ')}
const qs=[
{q:'Traduci in italiano: klappen',a:['funzionare|riuscire']},{q:'Scrivi il Perfekt di klappen',a:['hat geklappt']},{q:'Traduci in italiano: versuchen',a:['provare|tentare']},{q:'Scrivi il Perfekt di versuchen',a:['hat versucht']},{q:'Traduci in italiano: ausprobieren',a:['provare|sperimentare']},{q:'Scrivi il Perfekt di ausprobieren',a:['hat ausprobiert']},{q:'Traduci in italiano: anmachen',a:['accendere']},{q:'Scrivi il Perfekt di anmachen',a:['hat angemacht']},{q:'Traduci in italiano: ausmachen',a:['spegnere']},{q:'Scrivi il Perfekt di ausmachen',a:['hat ausgemacht']},{q:'Traduci in italiano: nehmen',a:['prendere']},{q:'Scrivi il Perfekt di nehmen',a:['hat genommen']},{q:'Traduci in italiano: anziehen',a:['vestirsi|indossare']},{q:'Scrivi il Perfekt di anziehen',a:['hat angezogen']},{q:'Traduci in italiano: fehlen',a:['mancare']},{q:'Scrivi il Perfekt di fehlen',a:['hat gefehlt']},{q:'Traduci in italiano: auspacken',a:['disimballare|spacchettare']},{q:'Scrivi il Perfekt di auspacken',a:['hat ausgepackt']},{q:'Completa la frase',sentence:['Ich ',' schon mal den Computer ',' .'],verb:'anmachen',a:['mache','an']},{q:'Completa la frase',sentence:['Am Abend ',' ich das Licht ',' .'],verb:'ausmachen',a:['mache','aus']},{q:'Traduci in italiano: wichtig',a:['importante']},{q:'Traduci in italiano: nervös',a:['nervoso']},{q:'Traduci in italiano: stressig',a:['stressante']},{q:'Traduci in italiano: streng',a:['severo']},{q:'Traduci in italiano: fertig',a:['finito|pronto']},{q:'Traduci in italiano: modern',a:['moderno']}];
let i=0,score=0,awarded=false,deferred=[],inDeferred=false;function opts(x){return x.split('|').map(norm)}function expected(j){return opts(qs[i].a[j]||qs[i].a[0])}function render(){awarded=false;let x=qs[i];$('prog').textContent=inDeferred?'Domanda rimandata · ne restano '+(deferred.length+1):'Domanda '+(i+1)+' / '+qs.length;$('q').textContent=x.q+(x.verb?' ('+x.verb+')':'');$('fb').textContent='';if(x.sentence){let h='<div class="sentence">';x.sentence.forEach((t,j)=>{h+=t;if(j<x.a.length)h+='<input autocomplete="off" data-j="'+j+'">'});$('inputs').innerHTML=h+'</div>'}else $('inputs').innerHTML='<input autocomplete="off" data-j="0">';let ins=[...$('inputs').querySelectorAll('input')];ins.forEach((el,j)=>el.addEventListener('keydown',e=>{if(e.key==='Enter'){if(ins[j+1])ins[j+1].focus();else check()}}));ins[0]?.focus()}function check(){let ins=[...$('inputs').querySelectorAll('input')];if(ins.some(x=>!x.value.trim())){$('fb').textContent='Completa tutte le caselle.';return}let ok=ins.every((x,j)=>expected(j).includes(norm(x.value)));if(ok){if(!awarded){score++;awarded=true;$('score').textContent=score}$('fb').innerHTML='<span class="ok">✓ Giusto!</span>'}else $('fb').innerHTML='<span class="bad">Non è ancora giusto. Correggi e riprova.</span>'}function grade(){return Math.round((1+5*score/qs.length)*10)/10}function share(){let n=grade().toFixed(1),txt='Quiz 1 di tedesco di Ilaria: '+score+'/'+qs.length+' risposte corrette. Valutazione: '+n+'/6.';if(navigator.share)navigator.share({text:txt});else location.href='mailto:?subject=Risultato Quiz 1&body='+encodeURIComponent(txt)}function finish(){let n=grade().toFixed(1);$('main').innerHTML='<div class="box"><h2>Quiz completato!</h2><p>Risultato: <b>'+score+'/'+qs.length+'</b></p><p style="font-size:22px">Valutazione: <b>'+n+'/6</b></p><p>Scala svizzera lineare: 6 = massimo, 4 = sufficiente.</p><button id="share">Inoltra il risultato</button><button class="alt" id="restart">Ricomincia</button></div>';$('share').onclick=share;$('restart').onclick=()=>location.reload()}function advance(){if(inDeferred){if(deferred.length){i=deferred.shift();render()}else finish()}else if(i<qs.length-1){i++;render()}else if(deferred.length){inDeferred=true;i=deferred.shift();render()}else finish()}$('check').onclick=check;$('solution').onclick=()=>{$('fb').textContent='Soluzione: '+qs[i].a.map(x=>x.split('|')[0]).join(' / ')};$('later').onclick=()=>{deferred.push(i);advance()};$('next').onclick=advance;render();</script></body></html>
