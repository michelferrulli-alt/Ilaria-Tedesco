<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz di tedesco – Ilaria</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6fb;margin:0;color:#172033}main{max-width:680px;margin:auto;padding:24px 16px}.box{background:white;padding:22px;border-radius:18px;box-shadow:0 3px 15px #0001}input{font-size:18px;padding:11px;border:1px solid #bbc3d1;border-radius:10px;width:150px;max-width:80%}button{font-size:16px;padding:12px 16px;border:0;border-radius:11px;margin:7px 5px 0 0;background:#315ee8;color:white}.alt{background:#e9edf7;color:#172033}.ok{color:#14823b;font-weight:700}.bad{color:#bd2838;font-weight:700}.top{display:flex;justify-content:space-between;gap:10px}.sentence{font-size:20px;line-height:2.5}a{color:#315ee8}</style></head><body><main id="main"><div class="box"><div class="top"><b id="prog"></b><b>Punti: <span id="score">0</span></b></div><h2 id="q"></h2><div id="inputs"></div><p id="fb"></p><button id="check">Controlla</button><button id="solution" class="alt">Mostra soluzione</button><button id="later" class="alt">Chiedimelo dopo</button><button id="next" class="alt">Prossima</button></div></main><script>
const $=x=>document.getElementById(x);const num=Math.max(2,Math.min(12,parseInt(new URLSearchParams(location.search).get('n')||'2')));document.title='Quiz '+num+' – Tedesco';
function norm(s){return s.toLocaleLowerCase('de-DE').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.,!?;:„“”"'’`´]/g,'').replace(/[-–—]/g,' ').replace(/\s+/g,' ')}
const V=[['auspacken','disimballare|spacchettare','hat ausgepackt'],['liegen','essere sdraiato|trovarsi','hat gelegen'],['stehen','stare in piedi|trovarsi','hat gestanden'],['hängen','essere appeso|stare appeso','hat gehangen'],['klappen','funzionare|riuscire','hat geklappt'],['versuchen','provare|tentare','hat versucht'],['ausprobieren','provare|sperimentare','hat ausprobiert'],['anmachen','accendere','hat angemacht'],['ausmachen','spegnere','hat ausgemacht'],['nehmen','prendere','hat genommen'],['anziehen','vestirsi|indossare','hat angezogen'],['fehlen','mancare','hat gefehlt'],['wohnen','abitare','hat gewohnt']];
const W=[['der Fernseher','il televisore|televisore'],['das Bett','il letto|letto'],['der Flur','il corridoio|corridoio'],['die Küche','la cucina|cucina'],['das Schlafzimmer','la camera da letto|camera da letto'],['das Wohnzimmer','il soggiorno|soggiorno'],['die Terrasse','la terrazza|terrazza'],['der Garten','il giardino|giardino'],['das Zimmer','la stanza|stanza'],['das Bad','il bagno|bagno'],['die Garage','il garage|garage'],['der Sessel','la poltrona|poltrona'],['der Teppich','il tappeto|tappeto'],['der Stuhl','la sedia|sedia'],['das Sofa','il divano|divano'],['die Wand','il muro|la parete|muro|parete'],['der Balkon','il balcone|balcone'],['der Ordner','il classificatore|classificatore'],['der Schrank',"l'armadio|armadio"],['der Kühlschrank','il frigorifero|frigorifero'],['der Spiegel','lo specchio|specchio'],['die Ordnung',"l'ordine|ordine"],['das Chaos','il caos|caos'],['komisch','strano|buffo|divertente'],['eigentlich','in realtà|veramente'],['wichtig','importante'],['anders','diverso|diversamente'],['jung','giovane'],['nervös','nervoso'],['stressig','stressante'],['streng','severo'],['fertig','finito|pronto'],['modern','moderno'],['alt','vecchio']];
const S=[
[['Ich ',' schon mal den Computer ',' .'],'anmachen',['mache','an']],[['Am Abend ',' ich das Licht ',' .'],'ausmachen',['mache','aus']],[['Er ',' seine Jacke ',' .'],'anziehen',['zieht','an']],[['Wir ',' alles ',' .'],'auspacken – Perfekt',['haben','ausgepackt']],[['Ich ',' meine Kopfhörer.'],'nehmen',['nehme']],[['Es ',' heute gut.'],'klappen',['klappt']],[['Du ',' es noch einmal.'],'versuchen',['versuchst']],[['Wir ',' es morgen ',' .'],'ausprobieren',['probieren','aus']],[['Du ',' uns sehr.'],'fehlen + Dativ',['fehlst']],[['Ihr ',' mir sehr.'],'fehlen + Dativ',['fehlt']],[['Die Poster ',' an der Wand.'],'hängen',['hängen']],[['Die Stühle ',' auf dem Balkon.'],'stehen',['stehen']],[['Das Handy ',' auf dem Tisch.'],'liegen',['liegt']],[['Sie ',' in einer modernen Wohnung.'],'wohnen',['wohnt']],[['Ich ',' gestern das Licht ',' .'],'ausmachen – Perfekt',['habe','ausgemacht']],[['Er ',' seine Jacke ',' .'],'anziehen – Perfekt',['hat','angezogen']],[['Das Handy ',' auf dem Tisch ',' .'],'liegen – Perfekt',['hat','gelegen']],[['Die Stühle ',' auf dem Balkon ',' .'],'stehen – Perfekt',['haben','gestanden']],[['Die Poster ',' an der Wand ',' .'],'hängen – Perfekt',['haben','gehangen']],[['Du ',' uns sehr ',' .'],'fehlen – Perfekt',['hast','gefehlt']],[['Wir ',' das gestern ',' .'],'ausprobieren – Perfekt',['haben','ausprobiert']],[['Der Plan ',' gut ',' .'],'klappen – Perfekt',['hat','geklappt']]];
function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}function pick(a,n,r){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b.slice(0,n)}
let r=rng(900+num),qs=[];pick(V,6,r).forEach(v=>{qs.push({q:'Traduci in italiano: '+v[0],a:[v[1]]});qs.push({q:'Scrivi il Perfekt di '+v[0],a:[v[2]]})});pick(S,10,r).forEach(s=>qs.push({q:'Completa la frase',sentence:s[0],verb:s[1],a:s[2]}));pick(W,6,r).forEach(w=>qs.push({q:'Traduci in italiano: '+w[0],a:[w[1]]}));
let i=0,score=0,awarded=false,deferred=[],inDeferred=false;function opts(x){return x.split('|').map(norm)}function expected(j){return opts(qs[i].a[j]||qs[i].a[0])}
function render(){awarded=false;let x=qs[i];$('prog').textContent=inDeferred?'Domanda rimandata · ne restano '+(deferred.length+1):'Domanda '+(i+1)+' / '+qs.length;$('q').textContent=x.q+(x.verb?' ('+x.verb+')':'');$('fb').textContent='';if(x.sentence){let h='<div class="sentence">';x.sentence.forEach((t,j)=>{h+=t;if(j<x.a.length)h+='<input autocomplete="off" data-j="'+j+'">'});$('inputs').innerHTML=h+'</div>'}else $('inputs').innerHTML='<input autocomplete="off" data-j="0">';let ins=[...$('inputs').querySelectorAll('input')];ins.forEach((el,j)=>el.addEventListener('keydown',e=>{if(e.key==='Enter'){if(ins[j+1])ins[j+1].focus();else check()}}));ins[0]?.focus()}
function check(){let ins=[...$('inputs').querySelectorAll('input')];if(ins.some(x=>!x.value.trim())){$('fb').textContent='Completa tutte le caselle.';return}let ok=ins.every((x,j)=>expected(j).includes(norm(x.value)));if(ok){if(!awarded){score++;awarded=true;$('score').textContent=score}$('fb').innerHTML='<span class="ok">✓ Giusto!</span>'}else $('fb').innerHTML='<span class="bad">Non è ancora giusto. Correggi e riprova.</span>'}
function grade(){return Math.round((1+5*score/qs.length)*10)/10}function share(){let n=grade().toFixed(1),txt='Quiz '+num+' di tedesco di Ilaria: '+score+'/'+qs.length+' risposte corrette. Valutazione: '+n+'/6.';if(navigator.share)navigator.share({text:txt});else location.href='mailto:?subject=Risultato Quiz '+num+'&body='+encodeURIComponent(txt)}
function finish(){let n=grade().toFixed(1);$('main').innerHTML='<div class="box"><h2>Quiz completato!</h2><p>Risultato: <b>'+score+'/'+qs.length+'</b></p><p style="font-size:22px">Valutazione: <b>'+n+'/6</b></p><p>Scala svizzera lineare: 6 = massimo, 4 = sufficiente.</p><button id="share">Inoltra il risultato</button><button class="alt" id="restart">Ricomincia</button><p><a href="index.html">← Tutti i quiz</a></p></div>';$('share').onclick=share;$('restart').onclick=()=>location.reload()}
function advance(){if(inDeferred){if(deferred.length){i=deferred.shift();render()}else finish()}else if(i<qs.length-1){i++;render()}else if(deferred.length){inDeferred=true;i=deferred.shift();render()}else finish()}
$('check').onclick=check;$('solution').onclick=()=>{$('fb').textContent='Soluzione: '+qs[i].a.map(x=>x.split('|')[0]).join(' / ')};$('later').onclick=()=>{deferred.push(i);advance()};$('next').onclick=advance;render();
</script></body></html>
