<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lernwortschatz</title><style>body{font-family:Arial,sans-serif;background:#f4f6fb;color:#172033;margin:0}main{max-width:760px;margin:auto;padding:20px}.box{background:white;border-radius:16px;padding:20px;margin:14px 0}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}button{padding:13px;border:0;border-radius:11px;background:#315ee8;color:white;font-size:16px}.alt{background:#e8edfa;color:#172033}.card{text-align:center;min-height:180px;display:flex;justify-content:center;flex-direction:column}.word{font-size:26px;font-weight:bold}.muted{color:#667085}input{font-size:18px;padding:12px;width:90%;border:1px solid #bbb;border-radius:10px}.ok{color:green;font-weight:bold}.bad{color:#b42335;font-weight:bold}@media(min-width:650px){.menu{grid-template-columns:repeat(5,1fr)}}</style></head><body><main><p><a href="../">← Tedesco</a></p><h1>🇩🇪 Lernwortschatz</h1><p>55 parole ed espressioni</p><div class="menu"><button onclick="setMode('study')">📚 Studia</button><button onclick="setMode('flash')">🧠 Flashcard</button><button onclick="setMode('train')">✏️ Allenati</button><button onclick="setMode('quiz')">📝 Quiz</button><button onclick="setMode('review')">🎯 Ripasso</button></div><div id="app"></div></main><script>

const SB_URL="https://ocqnqswrwgvncylnajhz.supabase.co",SB_KEY="sb_publishable_5i67B4YIeEwGCxYgXSrxzw_APqa2CXz";const RUN=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));const STUDENT=localStorage.getItem("studioUser")||"Altro";let qlog=[];async function post(table,obj){try{await fetch(SB_URL+"/rest/v1/"+table,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(obj)})}catch(e){}}function logQuestion(id,w,prompt,first,ok,tries){post("question_results",{run_id:RUN,student_name:STUDENT,subject:"Tedesco",topic:"Unità 2 · Lernwortschatz",quiz_number:1,question_key:"lw-"+id,question_text:prompt,skill:w[0],correct_first_try:first,eventually_correct:ok,attempts:tries})}function logQuiz(){let grade=Math.round((1+5*score/20)*10)/10;post("quiz_attempts",{student_name:STUDENT,subject:"Tedesco",topic:"Unità 2 · Lernwortschatz",quiz_name:"Quiz dinamico "+quizNo,quiz_number:quizNo,score:score,total:20,grade:grade})}let mode="study",i=0,flip=false,score=0,count=0,quizNo=Number(localStorage.getItem("lwQuizNo")||0),quizDeck=[],weak=new Set(JSON.parse(localStorage.getItem("lwWeak")||"[]"));const A=document.getElementById("app");
function save(){localStorage.setItem("lwWeak",JSON.stringify([...weak]))}function info(w){return w[3]=="v"?"Perfekt: "+w[2]:w[3]=="n"?"Plurale: "+w[2]:""}function shuffle(a){let b=a.slice();for(let x=b.length-1;x>0;x--){let y=Math.floor(Math.random()*(x+1));[b[x],b[y]]=[b[y],b[x]]}return b}
function makeDeck(adaptive=false){let weakIds=[...weak],all=W.map((_,j)=>j),ids=[];if(adaptive&&weakIds.length){ids=shuffle(weakIds).slice(0,12);ids=ids.concat(shuffle(all.filter(x=>!ids.includes(x))).slice(0,20-ids.length))}else ids=shuffle(all).slice(0,20);return ids.map((id,k)=>{let w=W[id],types=["it","de"];if(w[3]=="n"&&w[2]!="solo singolare")types.push("plural");if(w[3]=="v")types.push("perfekt");let type=types[Math.floor(Math.random()*types.length)];return {id,w,type}})}
function setMode(m){mode=m;i=0;flip=false;score=0;count=0;if(m=="quiz"){quizNo++;localStorage.setItem("lwQuizNo",quizNo);quizDeck=makeDeck(false)}if(m=="review")quizDeck=makeDeck(true);render()}
function render(){if(mode=="study"){A.innerHTML='<div class="box"><h2>📚 Scheda di studio</h2>'+W.map(w=>'<p><b>'+w[0]+'</b> → '+w[1]+(info(w)?'<br><span class="muted">'+info(w)+'</span>':'')+'</p>').join("")+'</div>';return}if(mode=="flash"){let ids=W.map((_,j)=>j);if(!ids.length){A.innerHTML='<div class="box"><h2>🎉 Nulla da ripassare</h2></div>';return}let id=ids[i%ids.length],w=W[id];A.innerHTML='<div class="box card" id="card"><span class="muted">'+(i%ids.length+1)+' / '+ids.length+'</span><div class="word">'+(flip?w[1]+'<br><small>'+info(w)+'</small>':w[0])+'</div><p class="muted">'+(flip?'':'Tocca per girare')+'</p></div><button id="no">Da ripassare</button> <button id="yes">Lo so ✓</button>';document.getElementById("card").onclick=()=>{flip=!flip;render()};document.getElementById("no").onclick=()=>{weak.add(id);save();i++;flip=false;render()};document.getElementById("yes").onclick=()=>{weak.delete(id);save();i++;flip=false;render()};return}ask()}
function norm(s){return s.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[.,!?;:'"’]/g,"").replace(/\s+/g," ")}
function accepted(correct){return correct.split("/").map(norm)}
function ask(){let adaptive=mode=="review";if((mode=="quiz"||adaptive)&&count>=20){if(mode=="quiz")logQuiz();let n=(Math.round((1+5*score/20)*10)/10).toFixed(1);A.innerHTML='<div class="box"><h2>'+(adaptive?'🎯 Ripasso completato!':'Quiz completato!')+'</h2><p class="word">'+score+'/20</p><p>Nota indicativa: <b>'+n+'/6</b></p><button onclick="setMode(\''+(adaptive?'review':'quiz')+'\')">'+(adaptive?'Nuovo ripasso mirato':'Genera un nuovo quiz')+'</button></div>';return}
let item=(mode=="quiz"||adaptive)?quizDeck[count]:{id:i%W.length,w:W[i%W.length],type:i%2?"de":"it"},id=item.id,w=item.w,type=item.type,question,correct;
if(type=="it"){question="Traduci in italiano: "+w[0];correct=w[1]}
if(type=="de"){question="Scrivi in tedesco: "+w[1];correct=w[0]}
if(type=="plural"){question="Scrivi il plurale di "+w[0];correct=w[2]}
if(type=="perfekt"){question="Scrivi il Perfekt di "+w[0];correct=w[2]}
A.innerHTML='<div class="box"><span class="muted">'+(mode=="quiz"?"Quiz dinamico "+quizNo+" · ":adaptive?"Ripasso mirato · ":"Allenamento · ")+(count+1)+' / 20</span><h2>'+question+'</h2><input id="ans" autocomplete="off"><p id="fb"></p><button id="check">Controlla</button> <button class="alt" id="solution">Soluzione</button> <button class="alt" id="next">Prossima</button></div>';
let tries=0,first=null,lastOk=false,scored=false;document.getElementById("check").onclick=()=>{let v=document.getElementById("ans").value;if(!v.trim())return;tries++;let ok=accepted(correct).includes(norm(v));if(first===null)first=ok;lastOk=ok;if(ok){document.getElementById("fb").innerHTML='<span class="ok">✓ Giusto!</span>';weak.delete(id);if(!scored){score++;scored=true}}else{document.getElementById("fb").innerHTML='<span class="bad">Non ancora. Riprova.</span>';weak.add(id)}save()};
document.getElementById("solution").onclick=()=>{if(first===null)first=false;lastOk=false;weak.add(id);save();document.getElementById("fb").innerHTML="Soluzione: <b>"+correct+"</b>"};
document.getElementById("next").onclick=()=>{if(first===null){first=false;tries=1}if(mode=="quiz"||adaptive)logQuestion(id,w,question,first,lastOk,Math.max(1,tries));count++;i++;if(mode=="quiz"&&count>=20)logQuiz();render()};document.getElementById("ans").focus()}
