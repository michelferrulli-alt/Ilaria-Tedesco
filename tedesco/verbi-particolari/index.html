w'?'ripasso_verbi':'quiz_verbi');question()}}function card(){let v=V[index];area.innerHTML='<p class="muted">Scheda '+(index+1)+' / '+V.length+'</p><h2>'+esc(v[0])+'</h2>'+(shown?'<p><b>Italiano:</b> '+esc(v[4])+'</p><p><b>er:</b> '+esc(v[1])+' · '+esc(v[2])+'</p><p><b>Perfekt:</b> '+esc(v[3])+'</p>':'<p>Prova a ricordare tutte le forme.</p>')+'<button onclick="shown=true;card()">Mostra risposta</button><button class="secondary" onclick="index=(index+1)%V.length;shown=false;card()">Successiva →</button>'; }const fields=['Infinito','Präsens (er)','Präteritum (er)','Perfekt','Italiano'];function question(){if(pos>=queue.length){finish();return}let id=queue[pos],v=V[id],field=(pos%4)+1;window.field=field;tries=0;first=false;area.innerHTML='<p class="muted">Domanda '+(pos+1)+' / '+queue.length+' · Corrette al primo tentativo: '+score+'</p><h2>'+esc(v[0])+'</h2><p>Scrivi: <b>'+fields[field]+'</b></p><input id="answer" autocomplete="off" autocapitalize="off"><p id="feedback"></p><button onclick="check()">Controlla</button><button class="secondary" onclick="document.getElementById(\'feedback\').textContent=V[queue[pos]][field]">Mostra soluzione</button><button class="secondary" onclick="next(false)">Chiedimelo dopo / Salta</button>';document.getElementById('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()})}function check(){let answer=document.getElementById('answer').value,v=V[queue[pos]],ok=norm(answer)===norm(v[field])||(field===1&&norm(answer)===norm('er '+v[field]))||(field===2&&norm(answer)===norm('er '+v[field]));tries++;if(ok){first=tries===1;document.getElementById('feedback').innerHTML='<b class="good">✓ Corretto!</b>';next(true)}else document.getElementById('feedback').innerHTML='<b class="bad">Non ancora. Riprova.</b>'}function next(ok){let id=queue[pos],v=V[id];if(ok&&first)score++;completed.push({id,ok,first,tries:Math.max(1,tries),field});save('question_results',{run_id:run,student_name:STUDENT,subject:'Tedesco',topic:TOPIC,quiz_number:1,question_key:'verbi-a21-'+id+'-'+field,question_text:fields[field]+' di '+v[0],skill:v[0]+' · '+fields[field],correct_first_try:!!first,eventually_correct:!!ok,attempts:Math.max(1,tries)});pos++;question()}function finish(){let wrong=completed.filter(x=>!x.first).map(x=>x.id);localStorage.setItem('verbiA21Errori',JSON.stringify([...new Set(wrong)]));let grade=Math.round((1+5*score/queue.length)*10)/10;save('quiz_attempts',{student_name:STUDENT,subject:'Tedesco',topic:TOPIC,quiz_name:mode==='review'?'Ripasso mirato':'Verifica verbi particolari',quiz_number:1,score,total:queue.length,grade});area.innerHTML='<h2>Verifica completata</h2><p>Corrette al primo tentativo: <b>'+score+'/'+queue.length+'</b></p><p>Nota svizzera: <b>'+grade.toFixed(1)+'/6</b></p><p class="muted">I risultati vengono inviati alle statistiche; se la connessione è assente, il salvataggio potrebbe non riuscire.</p><button onclick="view(\'quiz\')">Nuova verifica</button><button class="secondary" onclick="view(\'review\')">Ripassa gli errori</button>'}view('study');
