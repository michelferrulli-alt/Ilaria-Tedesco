<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio di Ilaria</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6fb;margin:0;color:#172033}main{max-width:760px;margin:auto;padding:28px 18px}h1{margin-bottom:5px}.sub{color:#667085}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:25px}.card{background:#fff;border-radius:18px;padding:22px;text-decoration:none;color:#172033;box-shadow:0 3px 14px #0001}.card b{font-size:22px;display:block}.card span{color:#53627a}@media(max-width:520px){.grid{grid-template-columns:1fr}} .who{position:fixed;inset:0;background:#f4f6fb;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}.whoBox{background:#fff;max-width:520px;width:100%;padding:28px;border-radius:20px;box-shadow:0 8px 30px #0002;text-align:center}.whoBtn{display:block;width:100%;border:0;border-radius:14px;padding:16px;margin:10px 0;font-size:18px;font-weight:700;background:#315ee8;color:#fff}.whoBtn.other{background:#e9edf7;color:#172033}.identity{background:#eef2ff;border-radius:12px;padding:10px 14px;margin:14px 0;display:flex;justify-content:space-between;align-items:center}.identity button{border:0;background:none;color:#315ee8;font-weight:700}</style></head><body><div id="who" class="who" style="display:none"><div class="whoBox"><h1>👋 Chi sta studiando?</h1><p class="sub">Serve solo per tenere separati i progressi di Ilaria da quelli delle amiche.</p><button class="whoBtn" onclick="chooseUser('Ilaria')">👧 Sono Ilaria</button><button class="whoBtn other" onclick="chooseUser('Altro')">👥 Sono un’altra persona</button></div></div><main><h1>📚 Studio di Ilaria</h1><p class="sub">Scegli la materia.</p><div id="identity" class="identity"></div><div class="grid"><a class="card" href="tedesco/"><b>🇩🇪 Tedesco</b><span>Quiz e verifiche</span></a><a class="card" href="italiano/"><b>🇮🇹 Italiano</b><span>Quiz e verifiche</span></a><a class="card" href="statistiche.html"><b>📊 Statistiche</b><span>Tentativi, voti e progressi</span></a></div></main><script>
function chooseUser(n){localStorage.setItem("studioUser",n);showUser()}
function showUser(){let n=localStorage.getItem("studioUser");document.getElementById("who").style.display=n?"none":"flex";document.getElementById("identity").innerHTML=n?'<span>Profilo: <b>'+(n==="Ilaria"?"Ilaria":"Altra persona")+'</b></span><button onclick="localStorage.removeItem(\'studioUser\');showUser()">Cambia</button>':""}
showUser()
</script></body></html>
