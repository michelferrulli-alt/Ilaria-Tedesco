function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}function shuffle(a,r){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
